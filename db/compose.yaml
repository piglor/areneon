# A local Postgres 18 for development and CI only, bound to 127.0.0.1; never
# the Coolify database (ADR-007, #704). `make db-up` / `make db-down`.
name: areneon-rules-db
services:
  postgres:
    image: postgres:18.6@sha256:74935e72241653ca55e0414067e6d8763aceb8a810eb51b452253ec3dcfc4336
    environment:
      POSTGRES_DB: areneon
      # A throwaway superuser for the local container only.
      POSTGRES_PASSWORD: local-superuser
    ports:
      # RULES_DB_PORT (`make` passes it on) runs a second copy beside this one.
      - "127.0.0.1:${RULES_DB_PORT:-55432}:5432"
    healthcheck:
      # Probe over TCP (-h), not the unix socket: the image's init scripts run
      # on a temporary server that listens on the socket only, and the real one
      # starts after it stops. A socket probe can pass against the temporary
      # server, and the bootstrap then hits "the database system is shutting
      # down" (#830). Only the real server listens on TCP.
      test: ["CMD", "pg_isready", "-h", "127.0.0.1", "-U", "postgres", "-d", "areneon"]
      interval: 1s
      timeout: 3s
      retries: 30
