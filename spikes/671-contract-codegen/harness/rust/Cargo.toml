# Spike-only harness crate (#671); run.sh copies it into dist/rs/harness and
# drops the generated modules into src/. Not a workspace member.
[package]
name = "contract-codegen-spike"
version = "0.0.0"
edition = "2024"
publish = false
license = "Apache-2.0"

[dependencies]
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
regress = "=0.12.0"
jsonschema = { version = "=0.59.0", default-features = false }
serde_json_canonicalizer = "=0.4.1"
sha256 = { version = "=1.6.0", default-features = false }

[workspace]
