[project]
name = "areneon-dev"
version = "0.0.0"
description = "Areneon development tooling (workspace root)"
requires-python = ">=3.12,<3.13"
license = "Apache-2.0"

[dependency-groups]
dev = [
    "ruff==0.17.1",
    "mypy==2.4.0",
    "pytest==9.1.1",
    "pytest-cov==7.1.0",
    "hypothesis==6.170.1",
    "pre-commit>=4",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = [".agents", "vendor"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "PL", "PT"]

[tool.mypy]
strict = true
python_version = "3.12"
files = ["scripts", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests", "spikes"]
addopts = "--strict-markers --cov=scripts --cov-report=term-missing --cov-fail-under=90"
