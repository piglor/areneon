[project]
name = "areneon-dev"
version = "0.0.0"
description = "Areneon development tooling (workspace root)"
requires-python = ">=3.12,<3.13"
license = "Apache-2.0"

[dependency-groups]
dev = [
    "ruff==0.17.1",
    "mypy==2.4.0",
    "pytest==9.1.1",
    "pytest-cov==7.1.0",
    "pyyaml==6.0.3",
    "hypothesis==6.170.1",
    "pre-commit>=4",
    "datamodel-code-generator==0.85.0",
    "types-jsonschema==4.26.0.20261006",
    "areneon-contracts",
    "areneon-ml",
]

[tool.uv]
package = false

[tool.uv.workspace]
members = ["packages/schema/python", "ml"]
# The GPU training environment is its own uv project with its own lock (ADR-010 §5.2, C-1).
exclude = ["ml/gpu-env"]

[tool.uv.sources]
areneon-contracts = { workspace = true }
areneon-ml = { workspace = true }

# ADR-010 §5.1: the shipped lock resolves torch from the PyTorch CPU index
# only (explicit: no other package may come from it). The torch source itself
# is declared in ml/pyproject.toml.
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = [".agents", "vendor", "packages/schema/python/areneon_contracts/models"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "PL", "PT"]

[tool.ruff.lint.per-file-ignores]
# Test assertions compare against literal expectations.
"tests/**" = ["PLR2004"]

[tool.mypy]
strict = true
python_version = "3.12"
files = ["scripts", "tests", "packages/schema/python/areneon_contracts", "ml/areneon_ml"]

[tool.coverage.run]
# Generated declarations would pad the gate; it measures hand-written code.
omit = ["packages/schema/python/areneon_contracts/models/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# torch looks for numpy at import; the shipped closure has none (ADR-010 §5.1) and never needs it.
filterwarnings = ["ignore:Failed to initialize NumPy:UserWarning"]
addopts = "--strict-markers --cov=scripts --cov=areneon_contracts --cov=areneon_ml --cov-report=term-missing --cov-fail-under=90"
