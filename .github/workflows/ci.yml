name: ci

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # Only cancel superseded PR runs; a cancelled main run would show red on a good commit.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: astral-sh/setup-uv@v10.3.0
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy
      - run: uv run pytest
      - name: generated pydantic models (ADR-008)
        run: uv run --locked python scripts/contract_models.py

  typescript:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          submodules: true
          # The rules channel check rebuilds earlier main snapshots (ADR-007).
          fetch-depth: 0
      - uses: pnpm/action-setup@v6.1.0
      - uses: actions/setup-node@v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: build pinned Showdown
        run: make showdown
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - name: rules records and channel (ADR-007)
        # First parent: the main tip a PR merge commit merges into, or the
        # previous main tip for a squash commit pushed to main.
        env:
          RULES_BASE_REF: HEAD^1
        run: node packages/showdown-bridge/scripts/check-rules.ts
      - name: contract schemas and generated TS types (ADR-008)
        run: node packages/schema/scripts/contracts.ts

  team-guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: astral-sh/setup-uv@v10.3.0
      - run: make team-guard

  licences:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: pnpm/action-setup@v6.1.0
      - uses: actions/setup-node@v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - uses: astral-sh/setup-uv@v10.3.0
      - run: pnpm install --frozen-lockfile
      - name: production licences on allowlist (fails closed)
        run: make licences
      - name: licence gate rejects an injected AGPL dependency
        run: make licences-selftest

  database:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: pnpm/action-setup@v6.1.0
      - uses: actions/setup-node@v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: rules store schema, roles and triggers on Postgres 18 (ADR-007)
        run: make db-up db-test
      - if: always()
        run: make db-down

  gitleaks:
    runs-on: ubuntu-latest
    env:
      GITLEAKS_VERSION: 8.30.1
      GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - name: install gitleaks
        run: |
          tarball="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -fsSL -o "$tarball" "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${tarball}"
          echo "${GITLEAKS_SHA256}  ${tarball}" | sha256sum -c -
          tar -xzf "$tarball" gitleaks
          ./gitleaks version
      - run: ./gitleaks git --redact --verbose .

  osv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - name: osv-scanner
        uses: google/osv-scanner-action/osv-scanner-action@v2.7.0
        with:
          scan-args: |-
            --recursive
            ./

  dco:
    # Dependabot cannot sign off; skip only when GitHub says the PR author is
    # Dependabot (commit author emails can be set by anyone).
    if: github.event_name == 'pull_request' && github.event.pull_request.user.login != 'dependabot[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - name: every commit has Signed-off-by
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          missing=0
          for c in $(git rev-list --no-merges "$BASE..$HEAD"); do
            if ! git show -s --format=%B "$c" | grep -q '^Signed-off-by: '; then
              echo "::error::commit $c is missing Signed-off-by (use git commit -s)"
              missing=1
            fi
          done
          exit $missing

  ci:
    if: always()
    needs: [python, typescript, database, team-guard, licences, gitleaks, osv, dco]
    runs-on: ubuntu-latest
    steps:
      - name: all required jobs passed
        env:
          RESULTS: ${{ toJSON(needs.*.result) }}
        run: |
          echo "$RESULTS"
          ! echo "$RESULTS" | grep -Eq '"(failure|cancelled)"'
