name: ci

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  docker-probe:
    runs-on: [self-hosted, coolify]
    timeout-minutes: 5
    steps:
      - name: Docker client and daemon
        run: |
          set -euo pipefail
          uname -m
          docker version
          docker info --format '{{json .SecurityOptions}}'
      - name: install runner tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends make docker-compose-v2
          docker compose version
      - name: child container, workspace mounts, and localhost ports
        run: |
          set -euo pipefail
          probe_dir="$GITHUB_WORKSPACE/docker-probe"
          mkdir -p "$probe_dir"
          printf 'runner-docker-ok\n' > "$probe_dir/marker"
          trap 'docker rm -f runner-docker-probe >/dev/null 2>&1 || true' EXIT
          docker run --detach --rm --name runner-docker-probe \
            --publish 127.0.0.1:18080:8080 \
            --volume "$probe_dir:/www:ro" \
            busybox:1.37.0 httpd -f -p 8080 -h /www
          result=$(docker run --rm --network host busybox:1.37.0 \
            wget --timeout=5 -qO- http://127.0.0.1:18080/marker)
          test "$result" = runner-docker-ok
          printf 'runner-temp-ok\n' > "$RUNNER_TEMP/docker-marker"
          result=$(docker run --rm \
            --volume "$RUNNER_TEMP/docker-marker:/marker:ro" \
            busybox:1.37.0 cat /marker)
          test "$result" = runner-temp-ok
