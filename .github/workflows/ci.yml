name: ci

on:
  workflow_dispatch:
    inputs:
      check:
        type: choice
        default: licences
        options: [docker, licences, resources, tests, tests-narrow, tests-no-coverage, tests-go-memory]

permissions:
  contents: read

jobs:
  typescript-probe:
    if: startsWith(inputs.check, 'tests')
    runs-on: [self-hosted, coolify]
    timeout-minutes: 15
    env:
      npm_config_workspace_concurrency: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 4d498febbd29f5fec36b14a0c814a9708f7b6578
          submodules: true
      - name: install probe tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends make time
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version-file: .nvmrc
      - run: corepack enable && COREPACK_ENABLE_DOWNLOAD_PROMPT=0 pnpm --version
      - run: pnpm install --frozen-lockfile
      - name: resource counters before reproduction
        run: |
          date -u
          node -p 'JSON.stringify({constrainedMemory:process.constrainedMemory(),availableMemory:process.availableMemory(),parallelism:require("node:os").availableParallelism()})'
          for file in cpu.max cpu.stat cpu.pressure memory.max memory.current memory.peak memory.events memory.pressure; do
            if [ -f "/sys/fs/cgroup/$file" ]; then
              printf '\n%s\n' "$file"
              cat "/sys/fs/cgroup/$file"
            fi
          done
      - name: build pinned Showdown
        if: inputs.check != 'tests-go-memory'
        run: make showdown
      - name: build pinned Showdown with a Go heap budget
        if: inputs.check == 'tests-go-memory'
        env:
          GOMEMLIMIT: 384MiB
        run: make showdown
      - name: resource counters after the build
        if: always()
        run: |
          date -u
          for file in cpu.stat memory.current memory.peak memory.events memory.pressure; do
            if [ -f "/sys/fs/cgroup/$file" ]; then
              printf '\n%s\n' "$file"
              cat "/sys/fs/cgroup/$file"
            fi
          done
      - name: reproduce the failing corpus and schema tests with coverage
        # Diagnostic branch only: selected tests collect the same coverage;
        # full-suite coverage thresholds are enforced by PR #174's real CI.
        env:
          PROBE_CHECK: ${{ inputs.check }}
        run: |
          args=(--maxWorkers=1)
          if [ "$PROBE_CHECK" != tests ]; then
            args+=(--testNamePattern 'whole committed corpus|repository.s checked-in generated types|is classified by Ajv')
          fi
          if [ "$PROBE_CHECK" != tests-no-coverage ]; then
            args+=(--coverage --coverage.thresholds.lines=0 --coverage.thresholds.branches=0 \
              --coverage.thresholds.functions=0 --coverage.thresholds.statements=0)
          fi
          /usr/bin/time -v pnpm exec vitest run "${args[@]}" \
            packages/public-state/test/lines.test.ts \
            packages/schema/test/contracts.test.ts \
            packages/showdown-bridge/test/samples.test.ts
      - name: resource counters after reproduction
        if: always()
        run: |
          date -u
          for file in cpu.stat cpu.pressure memory.current memory.peak memory.events memory.pressure; do
            if [ -f "/sys/fs/cgroup/$file" ]; then
              printf '\n%s\n' "$file"
              cat "/sys/fs/cgroup/$file"
            fi
          done

  docker-probe:
    if: inputs.check == 'docker'
    runs-on: [self-hosted, coolify]
    timeout-minutes: 5
    steps:
      - name: Docker client and daemon
        run: |
          set -euo pipefail
          uname -m
          docker version
          docker info --format '{{json .SecurityOptions}}'
      - name: install runner tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends make docker-compose-v2
          docker compose version
      - name: child container, workspace mounts, and localhost ports
        run: |
          set -euo pipefail
          probe_dir="$GITHUB_WORKSPACE/docker-probe"
          mkdir -p "$probe_dir"
          printf 'runner-docker-ok\n' > "$probe_dir/marker"
          trap 'docker rm -f runner-docker-probe >/dev/null 2>&1 || true' EXIT
          docker run --detach --rm --name runner-docker-probe \
            --publish 127.0.0.1:18080:8080 \
            --volume "$probe_dir:/www:ro" \
            busybox:1.37.0 httpd -f -p 8080 -h /www
          result=$(docker run --rm --network host busybox:1.37.0 \
            wget --timeout=5 -qO- http://127.0.0.1:18080/marker)
          test "$result" = runner-docker-ok
          printf 'runner-temp-ok\n' > "$RUNNER_TEMP/docker-marker"
          result=$(docker run --rm \
            --volume "$RUNNER_TEMP/docker-marker:/marker:ro" \
            busybox:1.37.0 cat /marker)
          test "$result" = runner-temp-ok

  licences-probe:
    if: inputs.check == 'licences'
    runs-on: [self-hosted, coolify]
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version-file: .nvmrc
      - run: corepack enable && COREPACK_ENABLE_DOWNLOAD_PROMPT=0 pnpm --version
      - run: pnpm install --frozen-lockfile
      - name: capture the injected dependency licence report
        env:
          TMPDIR: ${{ runner.temp }}
        run: |
          set -euo pipefail
          repo="$PWD"
          printf 'workspace store: '
          pnpm store path
          scratch=$(mktemp -d)
          trap 'rm -rf "$scratch"' EXIT
          while IFS= read -r -d '' file; do
            mkdir -p "$scratch/$(dirname "$file")"
            cp "$file" "$scratch/$file"
          done < <(git ls-files -z Makefile package.json pnpm-lock.yaml pnpm-workspace.yaml \
            'packages/*/package.json' pyproject.toml uv.lock .python-version 'packages/schema/python/**' \
            'ml/**' scripts/__init__.py scripts/check_licenses.py scripts/python_licences.py \
            scripts/licence_exceptions.json scripts/check_cuda_separation.py)
          cd "$scratch"
          printf 'scratch store: '
          pnpm store path
          mkdir agpl-dep
          printf '{"name":"agpl-dep","version":"1.0.0","license":"AGPL-3.0-only"}\n' > agpl-dep/package.json
          pnpm --filter @areneon/showdown-bridge add --prefer-offline --ignore-scripts "file:$scratch/agpl-dep"
          status=0
          pnpm -r licenses list --prod --json > "$RUNNER_TEMP/licences-report.json" 2> "$RUNNER_TEMP/licences-error.txt" || status=$?
          printf 'pnpm report exit code: %s\n' "$status"
          cat "$RUNNER_TEMP/licences-report.json" "$RUNNER_TEMP/licences-error.txt"
          output=$(python3 "$repo/scripts/check_licenses.py" < "$RUNNER_TEMP/licences-report.json" 2>&1) || true
          printf '%s\n' "$output"
          test "$status" -eq 0
          [[ "$output" == *agpl-dep@AGPL-3.0-only* ]]

  runner-resources:
    if: inputs.check == 'resources'
    runs-on: [self-hosted, coolify]
    timeout-minutes: 2
    steps:
      - name: inspect runner resource limits
        run: |
          set -euo pipefail
          printf 'CPU count: '
          getconf _NPROCESSORS_ONLN
          cat /proc/self/cgroup
          awk '/cgroup/ {print}' /proc/self/mountinfo
          /home/runner/externals/node24/bin/node -p 'JSON.stringify({constrainedMemory:process.constrainedMemory(),availableMemory:process.availableMemory(),parallelism:require("node:os").availableParallelism()})'
          awk '/MemTotal|MemAvailable|SwapTotal|SwapFree/ {print}' /proc/meminfo
          for file in cpu.max memory.max memory.current; do
            if [ -f "/sys/fs/cgroup/$file" ]; then
              printf '%s: ' "$file"
              cat "/sys/fs/cgroup/$file"
            fi
          done
