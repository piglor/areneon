version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule: { interval: weekly }
    # The private team store's S3 signing library (ADR-015): an exact pin,
    # bumped by hand after review. This ignores version updates only;
    # security-update PRs may still open, and the osv job still scans.
    ignore:
      - dependency-name: "aws4fetch"
      # The calc differential's oracle (ADR-016 section 4): an exact devDependency,
      # bumped by hand with the divergence list re-triaged.
      - dependency-name: "@smogon/calc"
  - package-ecosystem: uv
    directory: /
    schedule: { interval: weekly }
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
