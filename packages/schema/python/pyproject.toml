[project]
name = "areneon-contracts"
version = "0.0.0"
description = "Areneon's cross-language data contracts for Python: generated pydantic models, validators and JCS hashing (ADR-008)"
requires-python = ">=3.12,<3.13"
license = "Apache-2.0"
dependencies = [
    "pydantic==2.14.1",
    "jsonschema==4.26.0",
    "rfc8785==0.1.4",
]

[build-system]
requires = ["hatchling==1.33.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["areneon_contracts"]
