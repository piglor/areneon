repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.1
    hooks:
      - id: ruff-check
      - id: ruff-format
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks
  - repo: local
    hooks:
      - id: no-pokepaste
        name: reject PokePaste team files outside fixtures/
        entry: python3 scripts/check_no_pokepaste.py
        language: system
        types: [text]
      - id: eslint
        name: eslint
        entry: pnpm exec eslint
        language: system
        files: \.(ts|js)$
        exclude: ^(\.agents|vendor)/
